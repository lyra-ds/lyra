<div id="root"></div>

<script type="text/babel">
const { AppShell, AppSidebar, PageHeader, Grid, Stack, ActionBar, Stat, Button, Icon, Breadcrumb, Avatar } = window.LyraDesignSystem_e82d95;

          collapsible

          onCollapsedChange={setCollapsed}
          brand={

          }
          groups={[{ items: [
            { id: "home", label: "Visão geral", icon: <Icon name="layout-dashboard" size={17} />, active: true },
            { id: "pkgs", label: "Pacotes", icon: <Icon name="package" size={17} />, badge: 12 },
            { id: "issues", label: "Issues", icon: <Icon name="circle-dot" size={17} /> },
            { id: "settings", label: "Configurações", icon: <Icon name="settings" size={17} /> },
          ] }]}
        />
      }
      topbar={
        <React.Fragment>
          <Breadcrumb items={[{ label: "Workspace" }, { label: "Visão geral" }]} />

      <Stack gap={6}>
        <PageHeader

          actions={<Button size="sm" iconLeft={<Icon name="plus" size={15} />}>Novo pacote</Button>}

          <Stat card label="Issues abertas" value="37" delta="3 esta semana" direction="down" />
          <Stat card label="Contribuidores" value="214" delta="estável" direction="flat" />
        </Grid>
      </Stack>
      <ActionBar count={3} label="pacotes selecionados" onClear={() => {}} actions={
        <React.Fragment>
          <Button size="sm" variant="secondary">Arquivar</Button>
          <Button size="sm" variant="danger">Excluir</Button>
        </React.Fragment>
      } />

}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
