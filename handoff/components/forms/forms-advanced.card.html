<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>body { background: var(--surface-page); margin: 0; padding: 24px; }</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Card, Fieldset, FormRow, Input, RadioGroup, CheckboxGroup, DatePicker, DateRangePicker, TimePicker } = window.LyraDesignSystem_e82d95;
function Demo() {
  return (
    <Card title="Novo release">
      <div style={{ display: "flex", flexDirection: "column", gap: "var(--space-6)" }}>
        <Fieldset legend="Publicação" description="Como e quando o release sai.">
          <FormRow>
            <Input label="Versão" placeholder="1.1.0" />
            <DatePicker label="Data de publicação" defaultValue="2026-08-03" />
            <TimePicker label="Hora" defaultValue="10:30" step={30} min="08:00" max="18:00" />
          </FormRow>
          <DateRangePicker label="Janela de divulgação" defaultValue={{ start: "2026-08-03", end: "2026-08-10" }} hint="Período em que o banner do release fica no site." />
          <RadioGroup
            label="Canal"
            defaultValue="latest"
            options={[
              { value: "latest", label: "Latest", hint: "instalação padrão via npm" },
              { value: "next", label: "Next", hint: "pré-release para testes" },
            ]}
          />
          <CheckboxGroup
            label="Notificar"
            direction="row"
            defaultValue={["changelog"]}
            options={[
              { value: "changelog", label: "Changelog" },
              { value: "discord", label: "Discord" },
              { value: "email", label: "E-mail" },
            ]}
          />
        </Fieldset>
      </div>
    </Card>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
