<!-- @dsCard group="Dashboard" viewport="1280x800" name="Lyra Dashboard" subtitle="Dashboard SaaS interativo — overview, projetos, configurações, dark mode" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyra · Dashboard</title>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  /* layout do app */
  .ld-app { display: flex; min-height: 100vh; }
  .ld-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ld-content { padding: var(--space-6); max-width: 1080px; width: 100%; margin: 0 auto; }
  .ld-stack { display: flex; flex-direction: column; gap: var(--space-5); }

  /* sidebar */
  .ld-sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: var(--surface-card);
    border-right: 1px solid var(--border-default);
    display: flex;
    flex-direction: column;
    padding: var(--space-4);
    gap: var(--space-4);
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .ld-sidebar__brand { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); }
  .ld-sidebar__mark { width: 26px; height: 26px; }
  .ld-mark-dark { display: none; }
  [data-theme="dark"] .ld-mark-light { display: none; }
  [data-theme="dark"] .ld-mark-dark { display: block; }
  .ld-sidebar__word {
    font-family: var(--font-display);
    font-weight: var(--weight-extrabold);
    font-size: 19px;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-right: auto;
  }
  .ld-sidebar__nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .ld-nav-item {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: var(--text-base);
    font-weight: var(--weight-medium);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
  }
  .ld-nav-item:hover { background: var(--surface-sunken); color: var(--text-primary); }
  .ld-nav-item--active { background: var(--accent-soft); color: var(--accent-soft-text); font-weight: var(--weight-semibold); }
  .ld-nav-item__count {
    margin-left: auto;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    background: var(--surface-sunken);
    color: var(--text-muted);
    padding: 0 7px;
    border-radius: var(--radius-full);
    line-height: 18px;
  }
  .ld-nav-item--active .ld-nav-item__count { background: rgba(255,255,255,0.55); }
  [data-theme="dark"] .ld-nav-item--active .ld-nav-item__count { background: rgba(0,0,0,0.25); }
  .ld-sidebar__foot {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    border-top: 1px solid var(--border-default);
    padding-top: var(--space-3);
  }
  .ld-sidebar__user { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .ld-sidebar__name { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary); }
  .ld-sidebar__mail { font-size: var(--text-xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }

  /* topbar */
  .ld-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--border-default);
    background: var(--surface-card);
    position: sticky;
    top: 0;
    z-index: var(--z-sticky);
  }
  .ld-topbar__title { font: var(--h2-font); letter-spacing: var(--tracking-heading); color: var(--text-primary); margin: 0; font-size: var(--text-xl); }
  .ld-topbar__actions { display: flex; align-items: center; gap: var(--space-2); }
  .ld-topbar__search { width: 240px; }
  .ld-topbar__search .lyra-input { cursor: pointer; }
  .ld-topbar__avatar {
    display: inline-flex;
    background: transparent;
    border: 0;
    padding: 0;
    border-radius: var(--radius-full);
    cursor: pointer;
  }
  .ld-topbar__avatar:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }

  /* grids */
  .ld-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
  .ld-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  .ld-grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-4); align-items: start; }

  /* chart */
  .ld-chart { display: flex; align-items: flex-end; gap: var(--space-3); height: 180px; }
  .ld-chart__col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); height: 100%; justify-content: flex-end; }
  .ld-chart__bar {
    width: 100%;
    max-width: 36px;
    background: var(--accent);
    opacity: 0.45;
    border-radius: var(--radius-xs) var(--radius-xs) 2px 2px;
    transition: opacity var(--duration-fast) var(--ease-out);
  }
  .ld-chart__col:hover .ld-chart__bar { opacity: 1; }
  .ld-chart__lbl { font-size: var(--text-xs); color: var(--text-faint); font-family: var(--font-mono); }

  /* goals */
  .ld-goal-row { display: flex; justify-content: space-between; font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-2); }
  .ld-goal-row strong { color: var(--text-primary); }

  /* toolbar */
  .ld-toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); }
  .ld-toolbar__right { display: flex; gap: var(--space-2); align-items: center; }

  /* project cards */
  .ld-proj { display: flex; flex-direction: column; gap: var(--space-2); }
  .ld-proj__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  .ld-proj__name { font-family: var(--font-mono); font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--text-primary); }
  .ld-proj__desc { margin: 0; font-size: var(--text-sm); color: var(--text-muted); }
  .ld-proj__foot { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-2); }
  .ld-proj__time { font-size: var(--text-xs); color: var(--text-faint); }

  /* settings */
  .ld-settings { display: flex; flex-direction: column; gap: var(--space-5); max-width: 720px; }
  .ld-settings__save { display: flex; justify-content: flex-end; gap: var(--space-2); }
  .ld-danger-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); }
  .ld-danger-row__t { margin: 0 0 2px; font-weight: var(--weight-semibold); color: var(--text-primary); font-size: var(--text-base); }
  .ld-danger-row__d { margin: 0; font-size: var(--text-sm); color: var(--text-muted); max-width: 420px; }

  /* section headers */
  .ld-section-title { margin: 0; font-size: var(--text-md); font-weight: var(--weight-bold); color: var(--text-primary); }
  .ld-section-sub { margin: 2px 0 0; font-size: var(--text-sm); color: var(--text-muted); }

  /* billing */
  .ld-plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
  .ld-plan {
    display: flex; flex-direction: column; gap: var(--space-2);
    border: 1.5px solid var(--border-default); border-radius: var(--radius-md);
    padding: var(--space-4); cursor: pointer;
    transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
  }
  .ld-plan:hover { border-color: var(--border-strong); }
  .ld-plan--selected { border-color: var(--accent); background: var(--accent-soft); }
  .ld-plan__head { display: flex; align-items: center; gap: var(--space-2); }
  .ld-plan__name { font-weight: var(--weight-bold); color: var(--text-primary); margin-right: auto; }
  .ld-plan__price { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--text-primary); letter-spacing: var(--tracking-heading); }
  .ld-plan__price span { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-muted); }
  .ld-plan__desc { margin: 0; font-size: var(--text-sm); color: var(--text-muted); line-height: var(--leading-normal); }
  .ld-plan-actions { display: flex; justify-content: flex-end; margin-top: var(--space-4); }
  .ld-payment { display: flex; align-items: center; gap: var(--space-3); }
  .ld-payment__chip {
    width: 44px; height: 32px; border-radius: var(--radius-sm);
    background: var(--surface-sunken); border: 1px solid var(--border-default);
    display: flex; align-items: center; justify-content: center; color: var(--text-muted);
  }
  .ld-payment__num { margin: 0; font-weight: var(--weight-semibold); color: var(--text-primary); font-size: var(--text-base); }
  .ld-payment__exp { margin: 0; font-size: var(--text-xs); color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens-admin.jsx"></script>
<script type="text/babel" src="screens-files.jsx"></script>
<script type="text/babel">
const TITLES = {
  overview: "Visão geral",
  projects: "Projetos",
  files: "Arquivos",
  members: "Membros",
  billing: "Cobrança",
  settings: "Configurações",
};

function App() {
  const [screen, setScreen] = React.useState(() => {
    const saved = localStorage.getItem("lyra-dash-screen");
    return TITLES[saved] ? saved : "overview";
  });
  const [dark, setDark] = React.useState(() => localStorage.getItem("lyra-dash-theme") === "dark");
  const [palette, setPalette] = React.useState(false);

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    localStorage.setItem("lyra-dash-theme", dark ? "dark" : "light");
  }, [dark]);
  React.useEffect(() => {
    localStorage.setItem("lyra-dash-screen", screen);
  }, [screen]);

  return (
    <div className="ld-app" data-screen-label={TITLES[screen]}>
      <LyraSidebar active={screen} onNavigate={setScreen} />
      <div className="ld-main">
        <LyraTopbar
          title={TITLES[screen]}
          dark={dark}
          onToggleTheme={() => setDark(!dark)}
          onNavigate={setScreen}
          onOpenPalette={() => setPalette(true)}
        />
        <div className="ld-content">
          {screen === "overview" && <OverviewScreen />}
          {screen === "projects" && <ProjectsScreen />}
          {screen === "files" && <FilesScreen />}
          {screen === "members" && <MembersScreen />}
          {screen === "billing" && <BillingScreen />}
          {screen === "settings" && <SettingsScreen />}
        </div>
      </div>
      <LyraCommandPalette
        open={palette}
        onOpen={() => setPalette(true)}
        onClose={() => setPalette(false)}
        onNavigate={setScreen}
      />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
