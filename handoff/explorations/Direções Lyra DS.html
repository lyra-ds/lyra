<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

/* ---------- shared building blocks ---------- */

function Swatch({ c, name, hex, dark }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6, flex: 1, minWidth: 0 }}>
      <div style={{ height: 56, borderRadius: 8, background: c, border: "1px solid rgba(0,0,0,0.06)" }}></div>
      <div style={{ fontSize: 11, fontWeight: 600, color: "#1e293b", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{name}</div>
      <div style={{ fontSize: 10, color: "#94a3b8", fontFamily: "JetBrains Mono, monospace" }}>{hex}</div>
    </div>
  );
}

function Btn({ t, mode, variant, children, radius, font }) {
  const dark = mode === "dark";
  const base = {
    fontFamily: font, fontSize: 14, fontWeight: 600, padding: "10px 18px",
    borderRadius: radius, border: "1px solid transparent", cursor: "pointer",
    display: "inline-flex", alignItems: "center", gap: 8, lineHeight: "20px",
  };
  const primary = dark ? (t.primaryD || t.primary) : t.primary;
  const onPrimary = dark ? (t.onPrimaryD || t.onPrimary) : t.onPrimary;
  const ghostText = dark ? (t.primaryTextD || t.primaryText || t.primaryD || t.primary) : (t.primaryText || t.primary);
  if (variant === "primary") return <button style={{ ...base, background: primary, color: onPrimary, boxShadow: dark ? "none" : "0 1px 2px rgba(0,0,0,0.08)" }}>{children}</button>;
  if (variant === "secondary") return <button style={{ ...base, background: dark ? t.surfaceRaisedD : "#fff", color: dark ? t.textD : t.text, border: `1px solid ${dark ? t.borderD : t.border}`, boxShadow: dark ? "none" : "0 1px 2px rgba(0,0,0,0.05)" }}>{children}</button>;
  return <button style={{ ...base, background: "transparent", color: ghostText }}>{children}</button>;
}

function Badge({ bg, fg, children, radius }) {
  return <span style={{ background: bg, color: fg, fontSize: 12, fontWeight: 600, padding: "3px 10px", borderRadius: radius, lineHeight: "18px" }}>{children}</span>;
}

function Toggle({ on, color, trackOff }) {
  return (
    <div style={{ width: 40, height: 22, borderRadius: 999, background: on ? color : trackOff, position: "relative", transition: "background .15s" }}>
      <div style={{ position: "absolute", top: 2, left: on ? 20 : 2, width: 18, height: 18, borderRadius: 999, background: "#fff", boxShadow: "0 1px 2px rgba(0,0,0,0.2)" }}></div>
    </div>
  );
}

function Field({ t, mode, radius, font, label, value, focus }) {
  const dark = mode === "dark";
  const accent = dark ? (t.primaryD || t.primary) : t.primary;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      <label style={{ fontFamily: font, fontSize: 13, fontWeight: 600, color: dark ? t.textD : t.text }}>{label}</label>
      <div style={{
        fontFamily: font, fontSize: 14, padding: "10px 14px", borderRadius: radius,
        background: dark ? t.surfaceD : "#fff", color: dark ? t.textD : t.text,
        border: focus ? `1.5px solid ${accent}` : `1px solid ${dark ? t.borderD : t.border}`,
        boxShadow: focus ? `0 0 0 3px ${t.ring}` : "none",
      }}>{value}</div>
    </div>
  );
}

function ModePanel({ t, mode, radius, font, displayFont }) {
  const dark = mode === "dark";
  const text = dark ? t.textD : t.text;
  const muted = dark ? t.mutedD : t.muted;
  const border = dark ? t.borderD : t.border;
  const surface = dark ? t.surfaceD : t.surface;
  const raised = dark ? t.surfaceRaisedD : "#ffffff";
  return (
    <div style={{ flex: 1, background: surface, borderRadius: 14, border: `1px solid ${border}`, padding: 24, display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontFamily: font, fontSize: 12, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: muted }}>{dark ? "Dark" : "Light"}</span>
        <Toggle on={dark} color={dark ? (t.primaryD || t.primary) : t.primary} trackOff={border} />
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <Btn t={t} mode={mode} variant="primary" radius={radius} font={font}>Criar projeto</Btn>
        <Btn t={t} mode={mode} variant="secondary" radius={radius} font={font}>Cancelar</Btn>
        <Btn t={t} mode={mode} variant="ghost" radius={radius} font={font}>Saiba mais</Btn>
      </div>
      <Field t={t} mode={mode} radius={radius} font={font} label="E-mail" value="voce@exemplo.dev" focus={true} />
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <Badge bg={t.badgeSuccessBg} fg={t.badgeSuccessFg} radius={t.badgeRadius}>Estável</Badge>
        <Badge bg={t.badgePrimaryBg} fg={t.badgePrimaryFg} radius={t.badgeRadius}>v1.0</Badge>
        <Badge bg={t.badgeWarnBg} fg={t.badgeWarnFg} radius={t.badgeRadius}>Beta</Badge>
      </div>
      <div style={{ background: raised, border: `1px solid ${border}`, borderRadius: radius + 4, padding: 18, boxShadow: dark ? "none" : t.cardShadow, display: "flex", flexDirection: "column", gap: 6 }}>
        <div style={{ fontFamily: font, fontSize: 13, fontWeight: 500, color: muted }}>Downloads mensais</div>
        <div style={{ fontFamily: displayFont, fontSize: 30, fontWeight: 700, color: text, letterSpacing: "-0.02em" }}>48.210</div>
        <div style={{ fontFamily: font, fontSize: 13, fontWeight: 600, color: t.success }}>↑ 12,4% vs. mês anterior</div>
      </div>
    </div>
  );
}

function DirectionBoard({ t, star, name, desc, radius, font, displayFont, typeLabel, radiusLabel }) {
  return (
    <div style={{ width: "100%", height: "100%", background: "#fff", padding: 32, boxSizing: "border-box", display: "flex", flexDirection: "column", gap: 24, fontFamily: font }}>
      {/* header */}
      <div style={{ display: "flex", alignItems: "baseline", gap: 14 }}>
        <div style={{ fontFamily: displayFont, fontSize: 28, fontWeight: 700, color: "#0f172a", letterSpacing: "-0.02em" }}>{star} <span style={{ color: t.primary }}>{name}</span></div>
        <div style={{ fontSize: 14, color: "#64748b" }}>{desc}</div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 16, fontSize: 12, color: "#94a3b8", fontFamily: "JetBrains Mono, monospace" }}>
          <span>{typeLabel}</span><span>{radiusLabel}</span>
        </div>
      </div>
      {/* palette */}
      <div style={{ display: "flex", gap: 12 }}>
        {t.palette.map((p) => <Swatch key={p.name} c={p.c} name={p.name} hex={p.hex} />)}
      </div>
      {/* type specimen */}
      <div style={{ display: "flex", gap: 24, alignItems: "center", borderTop: "1px solid #f1f5f9", borderBottom: "1px solid #f1f5f9", padding: "18px 0" }}>
        <div style={{ fontFamily: displayFont, fontSize: 54, fontWeight: 700, color: "#0f172a", letterSpacing: "-0.03em", lineHeight: 1 }}>Aa</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <div style={{ fontFamily: displayFont, fontSize: 22, fontWeight: 700, color: "#0f172a", letterSpacing: "-0.02em" }}>Construa interfaces que escalam</div>
          <div style={{ fontFamily: font, fontSize: 14, color: "#475569", maxWidth: 560 }}>Componentes acessíveis e consistentes para React, Vue, Laravel e Phoenix LiveView. Open source, do jeito que deveria ser.</div>
        </div>
        <div style={{ marginLeft: "auto", fontFamily: "JetBrains Mono, monospace", fontSize: 13, color: t.primary, background: t.badgePrimaryBg, padding: "8px 14px", borderRadius: 8 }}>npm i @lyra-ds/react</div>
      </div>
      {/* light / dark panels */}
      <div style={{ display: "flex", gap: 20, flex: 1 }}>
        <ModePanel t={t} mode="light" radius={radius} font={font} displayFont={displayFont} />
        <ModePanel t={t} mode="dark" radius={radius} font={font} displayFont={displayFont} />
      </div>
    </div>
  );
}

        <DCPostIt id="note-pal">Minha visão: A2 (Indigo Cósmico) tem a melhor história de marca — Lyra é uma constelação, e o indigo noturno + dark mode azulado contam isso. A3 (Ink) é o mais alinhado com a estética 2026 de libs open source, mas menos "dono de uma cor". O teal original continua válido se quiser diferenciação cromática.</DCPostIt>
