<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-card); display: flex; flex-direction: column; gap: 10px; }
  .block { background: var(--indigo-950); color: #C3C8E8; border-radius: var(--radius-md); padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; }
  .kw { color: var(--indigo-300); }
  .str { color: #7DD3A8; }
  .inline { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--surface-sunken); border: 1px solid var(--border-default); border-radius: var(--radius-xs); padding: 1px 6px; color: var(--accent-soft-text); }
</style>
</head>
<body>
<div class="block"><span class="kw">import</span> { Button } <span class="kw">from</span> <span class="str">"@lyra-ds/react"</span>;</div>
<div style="font-size: 13px; color: var(--text-secondary);">Inline code: instale com <span class="inline">npm i @lyra-ds/react</span> e importe <span class="inline">styles.css</span>.</div>
</body>
</html>
