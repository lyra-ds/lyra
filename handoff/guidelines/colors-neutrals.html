<!-- @dsCard group="Colors" viewport="700x120" name="Neutros · Slate" subtitle="Escala neutra fria para texto, bordas e superfícies" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--surface-card); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .chip { height: 48px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,0.05); }
  .name { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--slate-50)"></div><span class="name">50</span></div>
  <div class="sw"><div class="chip" style="background:var(--slate-100)"></div><span class="name">100</span></div>
  <div class="sw"><div class="chip" style="background:var(--slate-200)"></div><span class="name">200</span></div>
  <div class="sw"><div class="chip" style="background:var(--slate-300)"></div><span class="name">300</span></div>
  <div class="sw"><div class="chip" style="background:var(--slate-400)"></div><span class="name">400</span></div>
  <div class="sw"><div class="chip" style="background:var(--slate-500)"></div><span class="name">500</span></div>
  <div class="sw"><div class="chip" style="background:var(--slate-600)"></div><span class="name">600</span></div>
  <div class="sw"><div class="chip" style="background:var(--slate-700)"></div><span class="name">700</span></div>
  <div class="sw"><div class="chip" style="background:var(--slate-800)"></div><span class="name">800</span></div>
  <div class="sw"><div class="chip" style="background:var(--slate-900)"></div><span class="name">900</span></div>
</div>
</body>
</html>
