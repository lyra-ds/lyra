<!-- @dsCard group="Spacing" viewport="700x190" name="Escala de espaçamento" subtitle="Grade de 4px — tokens --space-*" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 20px; background: var(--surface-card); }
  .row { display: flex; align-items: center; gap: 12px; padding: 3px 0; }
  .tok { width: 86px; font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); flex-shrink: 0; }
  .bar { height: 12px; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 2px; }
</style>
</head>
<body>
<div class="row"><span class="tok">--space-1 · 4</span><div class="bar" style="width:4px"></div></div>
<div class="row"><span class="tok">--space-2 · 8</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="tok">--space-3 · 12</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="tok">--space-4 · 16</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="tok">--space-6 · 24</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="tok">--space-8 · 32</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="tok">--space-12 · 48</span><div class="bar" style="width:48px"></div></div>
<div class="row"><span class="tok">--space-16 · 64</span><div class="bar" style="width:64px"></div></div>
<div class="row"><span class="tok">--space-24 · 96</span><div class="bar" style="width:96px"></div></div>
</body>
</html>
