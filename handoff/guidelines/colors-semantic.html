<!-- @dsCard group="Colors" viewport="700x150" name="Semânticas" subtitle="Status em par soft + forte: success, warning, danger, info" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--surface-card); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pair { display: flex; flex-direction: column; gap: 6px; }
  .strong { height: 40px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .soft { height: 28px; border-radius: 0 0 var(--radius-sm) var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: var(--weight-semibold); }
  .lbl { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<div class="grid">
  <div class="pair">
    <div><div class="strong" style="background:var(--success)"></div><div class="soft" style="background:var(--success-soft);color:var(--success-text)">soft</div></div>
    <span class="lbl">--success</span>
  </div>
  <div class="pair">
    <div><div class="strong" style="background:var(--warning)"></div><div class="soft" style="background:var(--warning-soft);color:var(--warning-text)">soft</div></div>
    <span class="lbl">--warning</span>
  </div>
  <div class="pair">
    <div><div class="strong" style="background:var(--danger)"></div><div class="soft" style="background:var(--danger-soft);color:var(--danger-text)">soft</div></div>
    <span class="lbl">--danger</span>
  </div>
  <div class="pair">
    <div><div class="strong" style="background:var(--info)"></div><div class="soft" style="background:var(--info-soft);color:var(--info-text)">soft</div></div>
    <span class="lbl">--info</span>
  </div>
</div>
</body>
</html>
