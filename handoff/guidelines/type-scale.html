<!-- @dsCard group="Type" viewport="700x210" name="Escala tipográfica" subtitle="12→60px, major third — tokens --text-*" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 14px 20px; background: var(--surface-card); }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 3px 0; }
  .tok { width: 90px; font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); flex-shrink: 0; }
  .sample { color: var(--text-primary); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="row"><span class="tok">--text-xs 12</span><span class="sample" style="font-size:var(--text-xs)">Lyra Design System</span></div>
<div class="row"><span class="tok">--text-sm 13</span><span class="sample" style="font-size:var(--text-sm)">Lyra Design System</span></div>
<div class="row"><span class="tok">--text-base 14</span><span class="sample" style="font-size:var(--text-base)">Lyra Design System</span></div>
<div class="row"><span class="tok">--text-md 16</span><span class="sample" style="font-size:var(--text-md)">Lyra Design System</span></div>
<div class="row"><span class="tok">--text-xl 20</span><span class="sample" style="font-size:var(--text-xl)">Lyra Design System</span></div>
<div class="row"><span class="tok">--text-2xl 24</span><span class="sample" style="font-size:var(--text-2xl)">Lyra Design System</span></div>
<div class="row"><span class="tok">--text-4xl 38</span><span class="sample" style="font-size:var(--text-4xl)">Lyra DS</span></div>
</body>
</html>
