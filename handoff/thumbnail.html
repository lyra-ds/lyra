<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--indigo-600);display:flex;align-items:center;justify-content:center;gap:36px}
.main img{width:190px;height:190px}
.main span{font:var(--weight-extrabold) 220px/1 var(--font-display);letter-spacing:var(--tracking-display);color:#fff}
.strip{width:112px;display:flex;flex-direction:column}
.strip div{flex:1}
</style>
</head>
<body>
<div class="main"><img src="assets/lyra-mark-light.svg" alt="" /><span>Lyra</span></div>
<div class="strip">
<div style="background:var(--indigo-300)"></div>
<div style="background:var(--amber-500)"></div>
<div style="background:var(--green-600)"></div>
<div style="background:var(--indigo-900)"></div>
</div>
</body>
</html>
