# CI — runs on every PR regardless of which files changed; job names are
# required-check contexts, never rename them. The four job names below
# (lint, typecheck, test, build) are a FROZEN CONTRACT: they become the
# ruleset's required-status-check contexts (plan 01-05). Future quality
# gates (publint, attw, size-limit, token/class parity, stylelint) land as
# STEPS inside these four jobs in Phases 2-4 — never as new job names, which
# would orphan the ruleset contract.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token at the top level; widen per-job only when Phase 7 release
# automation needs it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # actionlint — checksum-verified binary (never a remote script piped into a
      # shell). The download is tamper-evident: the release tarball is verified
      # against the sha256 checksum literal committed below before it executes.
      - name: actionlint (checksum-verified)
        run: |
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color
      # Phase 2: stylelint on packages/styles (@lyra-ds/styles' only static CSS gate)
      - run: pnpm --filter @lyra-ds/styles run lint:css
      # Phase 3, RCT-03: @lyra-ds/react eslint (jsx-a11y + react-hooks + the
      # no-restricted-imports CSS-import ban — the machine-checked "zero CSS imports
      # in react src" rule; sideEffects:false would silently drop any stray CSS import).
      - run: pnpm --filter @lyra-ds/react run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Phase 3 delivered the first package typecheck: this now recurses into
      # @lyra-ds/react (tsc --noEmit) — RCT-04's types half. No yml change was needed
      # (the recursion reserved here since Phase 1 picked up the new package script).
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium MUST be installed BEFORE `pnpm run test`: the root test script is
      # `pnpm -r --if-present run test`, which now recurses into packages/styles'
      # Browser Mode suite (STY-03/STY-04). A fresh runner has no browser, so this
      # install has to precede the test step or CI fails deterministically.
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run test # recurses into @lyra-ds/styles Browser Mode suite (Phase 2)
      # Phase 2, STY-06: token/class parity script (fails on any handoff drift)
      - run: pnpm run parity
      # Phase 3, RCT-05: icon-registry drift guard (D-02) — regenerates in-memory and
      # byte-diffs against the committed registry, failing if it drifts from the handoff scan.
      - run: node tools/icon-registry/generate.mjs --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Phase 2, STY-07: publint validates the exports map (incl. ./styles.css) and
      # that sideEffects: ["**/*.css"] protects the CSS from consumer tree-shaking.
      # Invoked via the pinned lockfile devDep (pnpm exec), never floating dlx/npx.
      - run: pnpm exec publint packages/styles
      # Phase 2, STY-01/STY-02: packed-artifact smoke test — pnpm pack, install into a
      # throwaway fixture, real vite@8.1.5 consumer build, assert a .lyra-* class + a token.
      - run: node tools/pack-smoke/pack-smoke.mjs
      # Phase 3 gates for @lyra-ds/react — all run against the dist emitted by the
      # recursive `pnpm run build` above.
      # Phase 3, RCT-04: exports-map lint for the react package (dual ESM+CJS map).
      - run: pnpm exec publint packages/react
      # Phase 3, RCT-04: type-resolution check. --profile node16 because node10 (legacy
      # moduleResolution) cannot resolve the per-component exports-map subpaths — it is the
      # ONLY column that flags (node16 + bundler are green). RESEARCH A3; the default-profile
      # node10-only failure is recorded in 03-08-SUMMARY.md. node16 is the correct target for a
      # 2026 library and the fallback masks no other problem kind.
      - run: pnpm --filter @lyra-ds/react exec attw --pack . --profile node16
      # Phase 3, RCT-03 + RCT-05: per-minimal-import bundle budgets. Button proves isolation
      # (pulls zero lucide code); Icon proves registry containment (70 icons, not the ~1,400
      # set). lucide-react is deliberately NOT in either entry's ignore list.
      - run: pnpm --filter @lyra-ds/react exec size-limit
      # Phase 3 (Pitfall 3 suspenders): assert the RSC "use client" directive survived to
      # every dist .js/.cjs (belt = the tsup onSuccess prepend).
      - run: node tools/dist-scan/assert-use-client.mjs packages/react/dist
      # Phase 3, RCT-05 (threat T-03-16): semantic no-CDN scan over dist .js/.cjs/.d.ts —
      # fails on any known CDN host, on lucide-static, and on any non-allowlisted https?://
      # literal. The CDN-host list + allowlist prefixes live in the script and are shared
      # byte-identically with the 03-09 scratch-fixture scan (see its SYNC POINTER comment).
      - run: node tools/dist-scan/no-cdn-scan.mjs packages/react/dist
      # Phase 3, RCT-04 (D-27): the FINAL Phase 3 gate — packs @lyra-ds/react + @lyra-ds/styles,
      # npm-installs the tarballs into the committed Vite + Next.js scratch fixtures in an OS
      # temp dir, typechecks + builds both, runs a CJS require() consumer proof, and asserts the
      # end-to-end RCT-03/RCT-04 proofs (subpath + barrel resolution, tree-shaken isolation,
      # Next client-boundary + package resolution, production NODE_ENV strip, no CDN references).
      - run: node tools/smoke/smoke.mjs
