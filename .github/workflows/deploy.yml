# Deploy — builds both static exports on GitHub Actions and publishes the
# ready-made artifacts to Cloudflare Pages via wrangler (Direct Upload).
# The build deliberately does NOT run on Cloudflare: its build container
# caps the heap below what @lyra-ds/react's declaration build needs
# (measured in DEPLOY.md), so Cloudflare only ever receives files that were
# built here. The two Pages projects are Direct Upload projects — a
# Git-connected Pages project cannot receive wrangler deploys.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time and never cancelled mid-flight: the landing and the
# docs publish sequentially, and a cancelled run could leave one property
# newer than the other. A queued run always redeploys both from the newest
# commit, so skipping intermediate pushes is safe.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      # The declaration build of @lyra-ds/react needs more than 2.5 GB of
      # heap (measured — see DEPLOY.md); 4096 leaves ~60% headroom.
      NODE_OPTIONS: --max-old-space-size=8192
      # Public by construction (inlined into the static bundle), so they are
      # repository VARIABLES, not secrets. Absent values fail closed: no
      # analytics script, no analytics origin in the generated CSP.
      NEXT_PUBLIC_OPENPANEL_URL: ${{ vars.NEXT_PUBLIC_OPENPANEL_URL }}
      NEXT_PUBLIC_OPENPANEL_CLIENT_ID: ${{ vars.NEXT_PUBLIC_OPENPANEL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the shared library once; both apps consume its dist. Building
      # the apps directly (no `...` filter) avoids rebuilding react twice.
      - run: pnpm --filter @lyra-ds/react run build
      - run: pnpm --filter @lyra-ds/site run build
      - run: pnpm --filter @lyra-ds/docs run build
      # Landing first — the docs consent banner links to the privacy policy
      # hosted on lyra-ds.dev (DEPLOY.md, "Deploy the landing first").
      # wrangler runs via the pinned lockfile devDep (`pnpm exec`), never a
      # floating npx and not cloudflare/wrangler-action: the action's install
      # step runs a bare `pnpm add wrangler` that a pnpm workspace root
      # rejects (ERR_PNPM_ADDING_TO_ROOT — observed in run 30813009987).
      # --commit-dirty=true: the tree is legitimately dirty at this point
      # (generated `public/_headers` and `out/` are not committed); the flag
      # only silences wrangler's dirty-tree warning.
      - name: Publish landing to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy apps/site/out --project-name=lyra-ds-site --branch=main --commit-dirty=true
      - name: Publish docs to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy apps/docs/out --project-name=lyra-ds-docs --branch=main --commit-dirty=true

  evidence-preview:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'evidence/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout selected evidence ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Styles
        run: pnpm --filter @lyra-ds/styles run lint:css
      - name: Build React
        run: pnpm --filter @lyra-ds/react run build
      - name: Build Alpine
        run: pnpm --filter @lyra-ds/alpine run build
      - name: Build ordinary Docs
        run: pnpm --filter @lyra-ds/docs run build
      - name: Test evidence harness
        run: pnpm run evidence:file-upload:manual:test
      - name: Build isolated evidence harness
        env:
          FILE_UPLOAD_EVIDENCE: '1'
          LYRA_EVIDENCE_REVISION: ${{ github.sha }}
        run: |
          LYRA_EVIDENCE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          export LYRA_EVIDENCE_BUILD_TIME
          pnpm run evidence:file-upload:manual:build
      - name: Stage Function and publish evidence preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/file-upload-evidence-wrangler-output.jsonl
        run: |
          node tools/file-upload-evidence/scripts/stage-preview.mjs \
            --workspace-root="$GITHUB_WORKSPACE" \
            --docs-output="$GITHUB_WORKSPACE/apps/docs/out" \
            --harness-dist="$GITHUB_WORKSPACE/tools/file-upload-evidence/dist" \
            --revision="$GITHUB_SHA" \
            -- pnpm exec wrangler pages deploy "$GITHUB_WORKSPACE/apps/docs/out" \
              --project-name=lyra-ds-docs \
              --branch=file-upload-evidence \
              --commit-hash="$GITHUB_SHA" \
              --commit-dirty=true
      - name: Resolve immutable evidence deployment
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/file-upload-evidence-wrangler-output.jsonl
        run: |
          pnpm exec wrangler pages deployment list \
            --project-name=lyra-ds-docs \
            --environment=preview \
            --json > "$RUNNER_TEMP/file-upload-evidence-deployments.json"
          node tools/file-upload-evidence/scripts/deploy-policy.mjs resolve-preview \
            --wrangler-output="$WRANGLER_OUTPUT_FILE_PATH" \
            --deployment-list="$RUNNER_TEMP/file-upload-evidence-deployments.json" \
            --revision="$GITHUB_SHA" \
            --github-output="$GITHUB_OUTPUT"
      - name: Smoke immutable evidence deployment
        run: >-
          pnpm run evidence:file-upload:manual:smoke --
          --url="${{ steps.deployment.outputs.url }}"
          --revision="$GITHUB_SHA"
      - name: Summarize evidence preview
        run: |
          {
            echo "## FileUpload manual evidence preview"
            echo "- Immutable URL: ${{ steps.deployment.outputs.url }}"
            echo "- Branch alias: https://file-upload-evidence.lyra-ds-docs.pages.dev"
            echo "- Revision: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
