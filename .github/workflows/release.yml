# Release — changesets flow: while changesets exist on main, this keeps a
# "Version Packages" PR open/updated; when that PR merges (no changesets
# left), it builds and publishes @lyra-ds/styles + @lyra-ds/react to npm and
# creates the GitHub Releases from the changelogs.
#
# Auth is npm trusted publishing (OIDC) — configured on npmjs.com for both
# packages (org lyra-ds, repo lyra, workflow release.yml, no environment).
# The 0.1.0 release used a granular NPM_TOKEN because OIDC cannot perform a
# package's FIRST publish (npm/cli#8544). OIDC was proven end-to-end on the
# 0.1.1 release (SLSA provenance on both packages); the token and the
# NPM_TOKEN repo secret were revoked on 2026-08-03. Two npm/cli#8976 lessons are load-bearing here:
#   1. The publish runs in a TOP-LEVEL step, not through changesets/action's
#      `publish` input — the OIDC env vars (ACTIONS_ID_TOKEN_REQUEST_*) do
#      not survive the action's nested command chain.
#   2. setup-node has NO `registry-url` input — it would write an .npmrc
#      routing auth through NODE_AUTH_TOKEN, which npm prefers over the OIDC
#      exchange and 404s.
# If an OIDC publish ever fails, the recorded fallback is: re-add
# `registry-url: https://registry.npmjs.org` to setup-node and
# `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` to the publish step, with a
# fresh granular token.
#
# The Version Packages PR is opened with CHANGESETS_PAT (a fine-grained PAT:
# Contents + Pull requests, this repo only) instead of GITHUB_TOKEN. This is
# what makes CI run on that PR at all — GitHub never triggers workflows for
# events caused by GITHUB_TOKEN (anti-recursion rule), so a bot-created PR
# would sit with its 4 required checks forever unreported and need an admin
# override to merge. With the PAT, the version PR is gated like any other.
# The PAT expires (owner: franciscpd); when it does, the action falls back
# to GITHUB_TOKEN and the only symptom is version PRs with no checks again.
#
# The `snapshot` job lives in THIS file on purpose: npm allows only ONE
# trusted publisher per package, and the registration is scoped to a single
# workflow filename — a separate snapshot workflow could never publish via
# OIDC without replacing (and breaking) the release registration. Dispatching
# this workflow manually runs ONLY the snapshot job; pushes to main run ONLY
# the release job. Snapshot versions are throwaway `0.0.0-snapshot-*` builds
# on the npm `snapshot` dist-tag so contributors can test a ref without a
# real release; nothing is committed, tagged, or released on GitHub.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref-note:
        description: Optional note about the selected ref; shown in the logs.
        required: false
        type: string

permissions:
  contents: write # push the version branch, tags, GitHub Releases
  pull-requests: write # open/update the Version Packages PR
  id-token: write # npm trusted publishing (OIDC exchange)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Never run on forks — they have no secrets and must not try to publish.
    # Manual dispatches belong to the snapshot job below.
    if: github.repository == 'lyra-ds/lyra' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # @lyra-ds/react's declaration build needs >4 GB of heap with 71 per-entry dts builds (measured —
      # see DEPLOY.md); same value the deploy workflow uses.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets needs history to compute the changelog links.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # With changesets pending: open/refresh the Version Packages PR.
          # No `publish` input — see the npm/cli#8976 note in the header.
          version: pnpm exec changeset version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_PAT || secrets.GITHUB_TOKEN }}
      # Cheap guard so ordinary pushes to main (docs, site, CI) skip the
      # build+publish machinery: only proceed when the local version is not
      # on the registry yet. `changeset publish` is idempotent anyway — this
      # only saves the pointless react build on every unrelated push.
      - name: Check for unpublished versions
        id: unpublished
        if: steps.changesets.outputs.hasChangesets == 'false'
        # Checks EVERY publishable package, not just the styles/react fixed
        # group: @lyra-ds/alpine versions independently, so an alpine-only
        # bump must also flip the guard (cross-review finding, plan 09 task 1).
        run: |
          pending=false
          for pkg in packages/styles packages/react packages/alpine; do
            name=$(node -p "require('./$pkg/package.json').name")
            local_version=$(node -p "require('./$pkg/package.json').version")
            published=$(npm view "$name" version 2>/dev/null || echo "none")
            echo "$name local=$local_version published=$published"
            if [ "$local_version" != "$published" ]; then
              pending=true
            fi
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - name: Publish to npm (OIDC)
        if: steps.unpublished.outputs.pending == 'true'
        # Top-level `run` on purpose — the OIDC exchange needs the step's own
        # env (npm/cli#8976). Provenance: explicit because changesets
        # delegates to `pnpm publish`, which ignored publishConfig.provenance
        # on 0.1.0; the env var is honored by npm and pnpm alike.
        run: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Push tags and create GitHub Releases
        if: steps.unpublished.outputs.pending == 'true'
        # `changeset publish` created the local tags; the release notes are
        # the version's own section in each package CHANGELOG.md (the same
        # content changesets/action would have published).
        run: |
          git push origin --tags
          for pkg in packages/styles packages/react packages/alpine; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            tag="$name@$version"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              continue
            fi
            awk -v v="$version" '$0 == "## " v {flag=1; next} /^## / {flag=0} flag' "$pkg/CHANGELOG.md" > /tmp/notes.md
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file /tmp/notes.md
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snapshot:
    # Manual dispatch only. Publishes 0.0.0-snapshot-* to the `snapshot`
    # dist-tag so contributors can test the selected ref; no commits, no
    # tags, no GitHub Releases.
    if: github.repository == 'lyra-ds/lyra' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC exchange)
    env:
      # Same heap requirement as the release job (see DEPLOY.md).
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets needs history to compute the changelog links.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Describe snapshot
        run: |
          printf 'Snapshot ref: %s\n' "$GITHUB_SHA"
          printf 'Reference note: %s\n' "${REF_NOTE:-<none>}"
        env:
          REF_NOTE: ${{ inputs.ref-note }}
      - name: Check for changesets
        run: |
          changesets=(.changeset/*.md)
          for changeset in "${changesets[@]}"; do
            if [ "$changeset" != '.changeset/README.md' ] && [ -f "$changeset" ]; then
              exit 0
            fi
          done
          echo '::error::No changeset files were found for this ref. Add a changeset before dispatching a snapshot.'
          exit 1
      - name: Version packages for snapshot
        run: pnpm changeset version --snapshot snapshot
      - run: pnpm run build
      - name: Publish @lyra-ds/styles snapshot (OIDC)
        working-directory: packages/styles
        # Top-level `run` on purpose — the OIDC exchange needs the step's own
        # env (npm/cli#8976).
        run: pnpm publish --tag snapshot --no-git-checks
      - name: Publish @lyra-ds/react snapshot (OIDC)
        working-directory: packages/react
        # Top-level `run` on purpose — the OIDC exchange needs the step's own
        # env (npm/cli#8976).
        run: pnpm publish --tag snapshot --no-git-checks
