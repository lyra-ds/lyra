# Release — changesets flow: while changesets exist on main, this keeps a
# "Version Packages" PR open/updated; when that PR merges (no changesets
# left), it builds and publishes @lyra-ds/styles + @lyra-ds/react to npm and
# creates the GitHub Releases from the changelogs.
#
# Auth is a granular NPM_TOKEN (repo secret) for now — a DELIBERATE choice,
# not an oversight: npm trusted publishing (OIDC) cannot perform a package's
# FIRST publish, because a trusted publisher can only be configured on a
# package that already exists (npm/cli#8544). Provenance still comes from
# `publishConfig.provenance: true` in each package (the repo is public).
# After 0.1.0 exists: configure trusted publishers for both packages on
# npmjs.com, then swap this workflow to OIDC — add `id-token: write`, drop
# `registry-url`/NODE_AUTH_TOKEN, and mind npm/cli#8976 (publish must run
# from a top-level step, not nested through the action) — recorded in
# WORK.md so the swap is not improvised.
#
# The Version Packages PR is opened with CHANGESETS_PAT (a fine-grained PAT:
# Contents + Pull requests, this repo only) instead of GITHUB_TOKEN. This is
# what makes CI run on that PR at all — GitHub never triggers workflows for
# events caused by GITHUB_TOKEN (anti-recursion rule), so a bot-created PR
# would sit with its 4 required checks forever unreported and need an admin
# override to merge. With the PAT, the version PR is gated like any other.
# The PAT expires (owner: franciscpd); when it does, the action falls back
# to GITHUB_TOKEN and the only symptom is version PRs with no checks again.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # push the version branch, tags, GitHub Releases
  pull-requests: write # open/update the Version Packages PR

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Never run on forks — they have no secrets and must not try to publish.
    if: github.repository == 'lyra-ds/lyra'
    runs-on: ubuntu-latest
    env:
      # @lyra-ds/react's declaration build needs >2.5 GB of heap (measured —
      # see DEPLOY.md); same value the deploy workflow uses.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # changesets needs history to compute the changelog links.
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # Writes the .npmrc that routes npm auth through NODE_AUTH_TOKEN.
          # REMOVE this input when swapping to OIDC — with it present, npm
          # prefers the (then-empty) token over the OIDC exchange and 404s.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # With changesets pending: open/refresh the Version Packages PR.
          version: pnpm exec changeset version
          # Without changesets (version PR just merged): build react's dist
          # and publish both packages; the action then pushes the git tags
          # and creates the GitHub Releases from CHANGELOG.md entries.
          publish: pnpm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_PAT || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
