# Sponsors — refreshes the committed site artifacts on a schedule. Protected
# main requires the generated change to be reviewed through a pull request.
name: Refresh sponsors

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the SponsorKit token
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
        run: |
          if [ -z "$SPONSORKIT_GITHUB_TOKEN" ]; then
            echo 'Missing required SPONSORKIT_GITHUB_TOKEN secret.' >&2
            exit 1
          fi
      - name: Regenerate sponsor artifacts
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
        run: pnpm --filter @lyra-ds/site run update-sponsors
      - name: Detect committed artifact changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- apps/site/data/sponsors.json apps/site/public/sponsors.svg)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh the sponsors data pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='chore/sponsors-data'

          # Recreating this branch from the triggering main commit prevents old
          # generated commits from accumulating and keeps the PR review focused.
          git switch -C "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/site/data/sponsors.json apps/site/public/sponsors.svg
          git commit -m 'chore: refresh sponsors data'
          git push --force origin "$branch"

          pr_number="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title 'chore: refresh sponsors data' --add-assignee franciscpd --add-label 'docs site'
          else
            gh pr create --base main --head "$branch" --title 'chore: refresh sponsors data' --body 'Automated SponsorKit refresh.' --assignee franciscpd --label 'docs site'
          fi
