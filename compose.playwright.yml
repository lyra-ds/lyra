services:
  browser-tests:
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    init: true
    ipc: host
    user: '${UID:?Set UID with id -u}:${GID:?Set GID with id -g}'
    working_dir: /workspace
    environment:
      CI: 'true'
    volumes:
      - .:/workspace
    command:
      - sh
      - -lc
      - |
        mkdir -p /tmp/corepack-shims
        corepack enable --install-directory /tmp/corepack-shims
        export PATH="/tmp/corepack-shims:$PATH"
        corepack pnpm@11.13.1 install --frozen-lockfile
        corepack pnpm@11.13.1 run test:browsers
